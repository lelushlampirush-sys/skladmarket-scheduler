name: Dispatch SkladMarket Telegram report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skladmarket-report-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the private report workflow
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          test -n "$DISPATCH_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lelushlampirush-sys/skladmarket/actions/workflows/ava-drive-orders.yml/dispatches \
            --data '{"ref":"main"}'

name: Dispatch SkladMarket Telegram report

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-orders.yml
  schedule:
    # Temporary delivery test: 15:32 Asia/Novosibirsk (UTC+7), every day.
    # Later slots retry if GitHub drops or delays the first schedule event.
    - cron: "32 8 * * *"
    - cron: "37 8 * * *"
    - cron: "42 8 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skladmarket-report-dispatch
  cancel-in-progress: false

jobs:
  prime-scheduler:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Public scheduler registered from push; no private workflow is called."
  dispatch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the private report workflow
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          test -n "$DISPATCH_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lelushlampirush-sys/skladmarket/actions/workflows/ava-drive-orders.yml/dispatches \
            --data '{"ref":"main"}'
